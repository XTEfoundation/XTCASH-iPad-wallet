name: XTCASHWallet
options:
  bundleIdPrefix: io.traaitt
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  XTEWalletCore:
    path: .
targets:
  XTCASHWallet:
    type: application
    platform: iOS
    sources:
      - path: App/XTCASHWallet
        excludes:
          - PrivacyInfo.xcprivacy
      - path: App/XTCASHWallet/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: XTEWalletCore
        product: XTEWalletCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.traaitt.cash.ipad
        PRODUCT_NAME: XTCASHWallet
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/XTCASHWallet/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    info:
      path: App/XTCASHWallet/Info.plist
      properties:
        CFBundleDisplayName: XTCASH
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Only standard, exempt crypto (CryptoNote signing/key derivation, Keychain, HTTPS).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            trrxitte.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSFaceIDUsageDescription: Face ID protects access to your XTCASH wallet keys.
        CFBundleURLTypes:
          - CFBundleURLName: io.traaitt.cash.payment
            CFBundleURLSchemes: [xtcash]
  XTCASHWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/XTCASHWalletTests
    dependencies:
      - target: XTCASHWallet
      - package: XTEWalletCore
        product: XTEWalletCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.traaitt.cash.ipad.tests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/XTCASHWallet.app/XTCASHWallet
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  XTCASHWallet:
    build:
      targets:
        XTCASHWallet: all
        XTCASHWalletTests: [test]
    test:
      targets:
        - XTCASHWalletTests
      gatherCoverageData: false
