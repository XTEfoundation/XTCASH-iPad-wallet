name: XTCASHWallet
options:
  bundleIdPrefix: io.traaitt
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "1"
packages:
  XTEWalletCore:
    path: .
targets:
  XTCASHWallet:
    type: application
    platform: iOS
    sources:
      - path: App/XTCASHWallet
        excludes:
          - PrivacyInfo.xcprivacy
      - path: App/XTCASHWallet/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: XTEWalletCore
        product: XTEWalletCore
      - target: XTCASHWalletWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.traaitt.xtcash.ipad
        PRODUCT_NAME: XTCASHWallet
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/XTCASHWallet/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/XTCASHWallet/XTCASHWallet.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: App/XTCASHWallet/XTCASHWallet.entitlements
      properties:
        # The app's own group stays first (default for the wallet keys); extensions only get ".shared".
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.traaitt.xtcash.ipad
          - $(AppIdentifierPrefix)io.traaitt.xtcash.ipad.shared
    info:
      path: App/XTCASHWallet/Info.plist
      properties:
        CFBundleDisplayName: XTCASH
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Only standard, exempt crypto (CryptoNote signing/key derivation, Keychain, HTTPS).
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            trrxitte.com:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
          - $(PRODUCT_BUNDLE_IDENTIFIER).sync
        NSFaceIDUsageDescription: Face ID protects access to your XTCASH wallet keys, the address book and sending.
        NSSupportsLiveActivities: true
        NSUserActivityTypes:
          - io.traaitt.xtcashwallet.receive
          - io.traaitt.xtcashwallet.send
        WalletTicker: XTCASH
        WalletPaymentScheme: xtcash
        WalletRouteScheme: xtcashwallet
        WalletActivityPrefix: io.traaitt.xtcashwallet
        WalletSharedKeychainGroup: $(AppIdentifierPrefix)io.traaitt.xtcash.ipad.shared
        CFBundleURLTypes:
          - CFBundleURLName: io.traaitt.xtcash.payment
            CFBundleURLSchemes: [xtcash]
          - CFBundleURLName: io.traaitt.xtcash.app
            CFBundleURLSchemes: [xtcashwallet]
  XTCASHWalletWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.traaitt.xtcash.ipad.widget
        PRODUCT_NAME: XTCASHWalletWidgets
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)io.traaitt.xtcash.ipad.shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: XTCASH Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WalletTicker: XTCASH
        WalletPaymentScheme: xtcash
        WalletRouteScheme: xtcashwallet
        WalletActivityPrefix: io.traaitt.xtcashwallet
        WalletSharedKeychainGroup: $(AppIdentifierPrefix)io.traaitt.xtcash.ipad.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  XTCASHWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/XTCASHWalletTests
    dependencies:
      - target: XTCASHWallet
      - package: XTEWalletCore
        product: XTEWalletCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.traaitt.xtcash.ipad.tests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/XTCASHWallet.app/XTCASHWallet
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  XTCASHWallet:
    build:
      targets:
        XTCASHWallet: all
        XTCASHWalletTests: [test]
    test:
      targets:
        - XTCASHWalletTests
      gatherCoverageData: false
