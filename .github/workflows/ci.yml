name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux, Swift)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test

  ipad:
    name: Build & test on iPad simulator
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: Core tests (macOS host)
        run: swift test

      - name: Pick an iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              ver = tuple(int(x) for x in runtime.rsplit("iOS-", 1)[-1].split("-"))
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPad"):
                      key = (ver, "Pro" in d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"], d["name"], runtime)
          if best is None:
              sys.exit("no iPad simulator available")
          print(best[1])
          print(f"{best[2]} ({best[3]})", file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Core tests on iPad simulator (xcodebuild)
        run: |
          set -o pipefail
          xcodebuild -list -json > schemes.json
          cat schemes.json
          SCHEME=$(python3 -c 'import json; s=json.load(open("schemes.json"))["workspace"]["schemes"]; print("XTEWalletCore-Package" if "XTEWalletCore-Package" in s else "XTEWalletCore")')
          echo "Using scheme $SCHEME"
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | tee core-ios.log | grep -E "Test (Suite|Case).*(passed|failed)|error:|\*\* TEST" 

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for iPad simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project XTCASHWallet.xcodeproj \
            -scheme XTCASHWallet \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | tee app-build.log | grep -E "error:|warning: .*XTCASHWallet|\*\* BUILD"

      - name: Test app on iPad simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project XTCASHWallet.xcodeproj \
            -scheme XTCASHWallet \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | tee app-test.log | grep -E "Test (Suite|Case).*(passed|failed)|error:|\*\* TEST"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: "*.log"
          if-no-files-found: ignore
