name: Live node check

# Talks to the real XTE network: node list, /info, /getwalletsyncdata, global indexes,
# random outputs, transaction status, and builds (but never broadcasts) a ring-signed
# transaction using real decoys. Separate from CI so that a node outage does not block merges.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      host:
        description: Node host
        default: main.trrxitte.com
      port:
        description: Node port
        default: "443"
      scheme:
        description: "ssl or plain"
        default: ssl

permissions:
  contents: read

jobs:
  live:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run xte-node-check
        working-directory: Tools/NodeCheck
        run: swift run -c release xte-node-check "${{ inputs.host || 'main.trrxitte.com' }}" "${{ inputs.port || '443' }}" "${{ inputs.scheme || 'ssl' }}"
